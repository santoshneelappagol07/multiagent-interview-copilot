[project]
name = "ai-voice-copilot-backend"
version = "0.1.0"
description = "FastAPI Backend for AI Voice Assistant & Interview Copilot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "google-generativeai>=0.5.4",
    "openai>=1.30.0",
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "protobuf>=5.27.0",
    "pymupdf>=1.24.4",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.7",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]
