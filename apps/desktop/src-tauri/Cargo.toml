[package]
name = "ai-voice-copilot"
version = "0.1.0"
description = "Next-Generation AI Voice Assistant & Real-Time Interview Copilot"
authors = ["AI Voice Copilot Team"]
edition = "2021"

[dependencies]
tauri = { version = "2.0.0", features = ["devtools"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Internal workspace crates
audio-engine = { path = "../../../crates/audio-engine" }
shared-types = { path = "../../../crates/shared-types" }

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
